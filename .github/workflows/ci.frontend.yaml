name: frontend ci
on: 
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.frontend.yaml'

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'
      - name: install
        run: pnpm install
      - name: typecheck
        run: pnpm typecheck
      - name: build
        run: pnpm build
      - name: lint
        run: pnpm lint
      - name: test
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: tsvideos-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # No backend runs here, so any HTTP status proves the server started.
      - name: smoke test image
        run: |
          docker run --detach --name frontend --publish 3000:3000 tsvideos-frontend:ci
          curl --silent --show-error --output /dev/null --retry 15 --retry-delay 2 --retry-all-errors http://localhost:3000/ \
            || { docker logs frontend; exit 1; }
